<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mohamed Samy Badr — My Work</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #09060f;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        /* BACKGROUND */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(100, 45, 150, 0.25), transparent 45%),
                linear-gradient(135deg, #12091d, #07050b 70%);
            z-index: -1;
        }

        /* HEADER */
        .top {
            padding: 70px 7% 35px;
            text-align: center;
        }

        .small-title {
            color: #b98cff;
            font-size: 13px;
            letter-spacing: 5px;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(55px, 8vw, 110px);
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -5px;
        }

        .description {
            margin: 28px auto 0;
            max-width: 600px;
            color: #aaa;
            font-size: 16px;
            line-height: 1.7;
        }

        /* BACK BUTTON */
        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 13px 24px;
            border: 1px solid #555;
            color: white;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .back-button:hover {
            background: white;
            color: black;
            transform: translateY(-3px);
        }

        /* VIDEO GRID */
        .work-container {
            width: 86%;
            max-width: 1300px;
            margin: 45px auto 100px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
        }

        .video-card {
            background: #111;
            border: 1px solid #29222f;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            overflow: hidden;
            transition: 0.4s ease;
        }

        .video-card:hover {
            transform: translateY(-8px);
            border-color: #8752b8;
            box-shadow: 0 20px 50px rgba(90, 35, 130, 0.25);
        }

        .video-card video {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            object-fit: cover;
            border-radius: 7px;
            background: #050505;
        }

        .project-info {
            padding: 18px 10px 12px;
        }

        .project-number {
            color: #9b6bc5;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 7px;
        }

        .project-name {
            font-size: 22px;
            font-weight: 700;
        }

        .click-text {
            color: #777;
            font-size: 12px;
            margin-top: 7px;
        }

        /* FULLSCREEN VIDEO */
        .video-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 40px;
        }

        .video-modal.active {
            display: flex;
        }

        .modal-video {
            width: min(1000px, 90vw);
            max-height: 85vh;
            border-radius: 8px;
            outline: none;
        }

        .close {
            position: absolute;
            top: 25px;
            right: 35px;
            color: white;
            font-size: 38px;
            cursor: pointer;
            font-weight: 200;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .top {
                padding-top: 45px;
            }

            h1 {
                letter-spacing: -3px;
            }

            .work-container {
                width: 92%;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }

            .video-card:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <main class="work-container">

                <video

            <!-- VIDEO 03 -->
            <div class="video-card" onclick="openVideo('https://player.mediadelivery.net/embed/769643/4d8d2966-0150-40ea-a752-31c841a3a212?autoplay=true&loop=false&muted=true&preload=true&responsive=true')">

    <!-- VIDEO POPUP -->

        <div class="close" onclick="closeVideo()">
            ×
        </div>

        <video
            id="modalVideo"
            class="modal-video"
            controls
            autoplay>
        </video>

    </div>

<script>
const hlsSources = [
    "https://res.cloudinary.com/qiruzoik/video/upload/v1791074089/project-01.mp4",
    "https://vz-12de7ae1-65f.b-cdn.net/497d35a3-3d51-4266-81ca-2bd311a4e823/playlist.m3u8",
    "https://vz-12de7ae1-65f.b-cdn.net/4d8d2966-0150-40ea-a752-31c841a3a212/playlist.m3u8",
    "https://vz-12de7ae1-65f.b-cdn.net/e12fa543-23a1-44b8-8fed-cdabd25009c7/playlist.m3u8"
];

function loadHlsLibrary(callback) {
    if (window.Hls) {
        callback();
        return;
    }

    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/hls.js@latest";
    script.onload = callback;
    document.head.appendChild(script);
}

function setupVideoPreviews() {
    const videos = document.querySelectorAll(".video-card video");

    videos.forEach((video, index) => {
        const source = hlsSources[index];

        if (source.includes(".m3u8")) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(source);
                hls.attachMedia(video);
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = source;
            }
        } else {
            video.src = source;
        }

        video.addEventListener("mouseenter", () => {
            video.play().catch(() => {});
        });

        video.addEventListener("mouseleave", () => {
            video.pause();
        });
    });
}

function openVideo(videoPath) {
    const modal = document.getElementById("videoModal");
    const video = document.getElementById("modalVideo");

    if (videoPath.includes("player.mediadelivery.net")) {
        const iframe = document.createElement("iframe");

        iframe.id = "modalVideo";
        iframe.src = videoPath;
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "0";
        iframe.allow = "accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen";
        iframe.allowFullscreen = true;

        video.replaceWith(iframe);
    } else {
        video.src = videoPath;
        video.play();
    }

    modal.classList.add("active");
}

function closeVideo() {
    const modal = document.getElementById("videoModal");
    const video = document.getElementById("modalVideo");

    if (video.tagName === "IFRAME") {
        video.remove();

        const newVideo = document.createElement("video");
        newVideo.id = "modalVideo";
        newVideo.className = "modal-video";
        newVideo.controls = true;
        newVideo.autoplay = true;

        document.querySelector(".video-modal").appendChild(newVideo);
    } else {
        video.pause();
        video.src = "";
    }

    modal.classList.remove("active");
}

loadHlsLibrary(setupVideoPreviews);
</script>
